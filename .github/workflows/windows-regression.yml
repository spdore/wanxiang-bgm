name: Windows build and regression

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
          architecture: x64

      - name: Install pinned helper build dependencies
        shell: pwsh
        run: >-
          python -m pip install --disable-pip-version-check
          pycryptodome==3.20.0 pyinstaller==6.22.3
          pyinstaller-hooks-contrib==2026.8 altgraph==0.17.5
          packaging==23.1 pefile==2023.2.7 pywin32-ctypes==0.2.3

      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'

      - name: Install pinned browser test dependency
        shell: pwsh
        run: |
          $uiDeps = Join-Path $env:RUNNER_TEMP 'wanxiang-ui-deps'
          npm install --prefix $uiDeps --no-save --no-audit --no-fund playwright@1.62.1
          & (Join-Path $uiDeps 'node_modules\.bin\playwright.cmd') install chromium
          "BGM_PLAYWRIGHT_PATH=$(Join-Path $uiDeps 'node_modules\playwright')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build 1.9.8 candidate and run isolated regressions
        shell: pwsh
        run: |
          $helper = 'local-only\build-staging\ci-helper.zip'
          .\tools\build-encrypted-audio-helper.ps1 -OutputArchive $helper -PythonPath (Get-Command python).Source
          .\build.ps1 -OutputName 'BgmHotkey_1.9.8-ci-candidate.exe' -OutputDirectory 'local-only\ci-release' -CryptoHelperArchive $helper -Platform x64 -PublicRelease
          .\tests\scripts\run_project_regressions.ps1 -HelperArchive $helper -NodePath (Get-Command node).Source -PlaywrightPath $env:BGM_PLAYWRIGHT_PATH

      - name: Upload unsigned candidate build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BgmHotkey-1.9.8-unsigned-candidate
          path: |
            local-only/ci-release/BgmHotkey_1.9.8-ci-candidate.exe
            local-only/ci-release/BgmHotkey_1.9.8-ci-candidate.exe.config
            local-only/ci-release/Microsoft.Web.WebView2.Core.dll
            local-only/ci-release/Microsoft.Web.WebView2.WinForms.dll
            local-only/ci-release/WebView2Loader.dll
          if-no-files-found: error
